name: 이슈 할당 시 브랜치 생성

# 이슈에 담당자가 지정되면 작업 브랜치를 만들고 이슈의 Development 항목에 연동한다.
# 담당자를 여러 번 바꿔도 이 이벤트는 그때마다 발생하므로, 이미 만들어 둔 것이 있으면 건너뛴다.
on:
  issues:
    types: [assigned]

permissions:
  # createLinkedBranch 는 브랜치를 만들고(contents) 이슈에 연결한다(issues).
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: 브랜치 생성 및 이슈 연동
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            /**
             * 이슈 제목을 git 브랜치 이름으로 쓸 수 있게 다듬는다.
             *
             * 글자·숫자와 - _ . 만 남기고 나머지는 - 로 바꾼다. git 이 금지하는 문자를
             * 걷어내는 것에 더해, ( ) ! # 처럼 셸에서 따옴표 없이 쓰기 어려운 문자도
             * 함께 없애려는 것이다 — checkout 할 때마다 따옴표를 붙이게 되면 곤란하다.
             *
             * 한글은 글자라서 그대로 남는다. 옮겨 적으면 원래 제목을 알아보기 어려워진다.
             */
            function slugify(title) {
              const cleaned = title
                .trim()
                // 남길 것 외에는 전부 -. 이름의 구분자인 _ 는 그대로 둔다.
                .replace(/[^\p{L}\p{N}\-_.]+/gu, '-')
                // .. 은 git 이 금지한다.
                .replace(/\.\.+/g, '.')
                .replace(/-+/g, '-')
                // 앞뒤의 . 과 - 는 떼어 낸다.
                .replace(/^[-.]+|[-.]+$/g, '')
                // 너무 길면 ref 도 UI 도 다루기 나쁘다.
                .slice(0, 80)
                .replace(/[-.]+$/, '');

              // .lock 으로 끝나는 ref 는 git 이 거부한다.
              const safe = cleaned.replace(/\.lock$/i, '-lock');

              return safe === '' ? 'issue' : safe;
            }

            const branch = `feature_${issue.number}_${slugify(issue.title)}`;

            core.info(`이슈 #${issue.number} → 브랜치 '${branch}'`);

            // 1. 이미 이 이슈에 연동된 브랜치가 있으면 아무것도 하지 않는다.
            const linked = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    linkedBranches(first: 10) {
                      nodes { ref { name } }
                    }
                  }
                }
              }`,
              { owner, repo, number: issue.number }
            );

            const existing = linked.repository.issue.linkedBranches.nodes
              .map((node) => node.ref?.name)
              .filter(Boolean);

            if (existing.length > 0) {
              core.notice(`이미 연동된 브랜치가 있어 건너뜁니다: ${existing.join(', ')}`);
              return;
            }

            // 2. 연동은 안 됐는데 같은 이름의 브랜치가 이미 있으면, 덮어쓰지 않고 알리기만 한다.
            //    (createLinkedBranch 는 브랜치를 새로 만드는 것이라 기존 이름과 부딪힌다.)
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              core.warning(
                `브랜치 '${branch}' 가 이미 있지만 이슈에 연동되어 있지 않습니다. `
                + '이슈 Development 항목에서 직접 연결해 주세요.'
              );
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // 3. 기본 브랜치의 최신 커밋에서 갈라 낸다.
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: base } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.default_branch
            });

            // 4. 브랜치 생성과 이슈 연동을 한 번에 한다.
            //    Development 항목에 붙이는 방법은 이 GraphQL mutation 뿐이다(REST 에는 없다).
            const created = await github.graphql(
              `mutation($issueId: ID!, $repositoryId: ID!, $oid: GitObjectID!, $name: String!) {
                createLinkedBranch(input: {
                  issueId: $issueId,
                  repositoryId: $repositoryId,
                  oid: $oid,
                  name: $name
                }) {
                  linkedBranch { ref { name } }
                }
              }`,
              {
                issueId: issue.node_id,
                repositoryId: context.payload.repository.node_id,
                oid: base.commit.sha,
                name: branch
              }
            );

            const name = created.createLinkedBranch.linkedBranch.ref.name;

            core.notice(
              `'${name}' 을 ${repository.default_branch}(${base.commit.sha.slice(0, 7)}) 에서 만들어 `
              + `이슈 #${issue.number} 의 Development 에 연동했습니다.`
            );
