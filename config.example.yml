# StockAgent 설정 예시.
# 실제 키가 들어가는 config.yml 은 커밋하지 않는다(.gitignore 처리됨).
#   cp config.example.yml config.yml

kis:
  # 실전투자: https://openapi.koreainvestment.com:9443
  # 모의투자: https://openapivts.koreainvestment.com:29443
  base_url: "https://openapi.koreainvestment.com:9443"
  app_key: "발급받은-appkey"
  app_secret: "발급받은-appsecret"
  # 발급한 access token 보관 위치. 재시작 후에도 재사용해 재발급 호출 제한을 피한다.
  token_cache_path: ".token_cache.json"
  timeout: 10s

push:
  # VictoriaMetrics Prometheus import 엔드포인트
  import_url: "http://localhost:8428/api/v1/import/prometheus"
  timeout: 10s
  # VictoriaMetrics 를 -httpAuth.username / -httpAuth.password 로 띄웠다면 같은 값을 넣는다.
  # 둘 다 비워 두면 인증 없이 보낸다.
  # username: "vm-user"
  # password: "vm-password"

# 장 운영 시간. KST(Asia/Seoul) 기준으로 해석한다.
market:
  open: "09:00"
  close: "15:30"

collect:
  interval: 30s

# 수집 대상 종목은 백엔드의 stock list API(GET {url}/stock)에서 읽는다(응답 항목의 code, name 필드).
# name 은 metric label 로 그대로 쓰인다. 한 번 정하면 바꾸지 않는 것이 좋다.
# 목록은 프로그램 시작 시와 매일 장 시작 시에 다시 읽는다. 장 중에 바꾸면 다음 장 시작부터 반영된다.
backend:
  url: "http://127.0.0.1:8080"
  timeout: 10s

log:
  # debug | info | warn | error. 실행 시 -log-level 플래그를 주면 그 값이 우선한다.
  level: info
  # 날짜(KST)별 로그 파일 stockagent-YYYY-MM-DD.log 를 이 디렉터리에 남긴다.
  dir: "logs"
